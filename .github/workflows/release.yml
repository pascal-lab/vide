name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v1.3.0
        required: true
        type: string
      dry-run:
        description: Build and validate without publishing
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          submodules: recursive
      - name: Validate tag, commit, and versions
        id: release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "${TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]]
          version="${TAG#v}"
          test "$(git rev-parse "refs/tags/${TAG}^{commit}")" = "$(git rev-parse HEAD)"
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | sed -n '1p')" = "${version}"
          test "$(node -p "require('./editors/vscode/package.json').version")" = "${version}"
          test "$(node -p "require('./editors/vscode/package-lock.json').version")" = "${version}"
          test -f "website/site/src/content/docs/en/changelog/${TAG//./-}/index.mdx"
          channel=stable
          if [[ "${version}" == *-* ]]; then
            channel=beta
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "channel=${channel}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build release artifacts
    needs: validate
    uses: ./.github/workflows/build-artifacts.yml
    with:
      source-ref: ${{ inputs.tag }}
      channel: ${{ needs.validate.outputs.channel }}
      cargo-profile: release
      vsix-profile: release

  publish-github:
    name: Publish GitHub Release
    if: ${{ !inputs.dry-run }}
    needs: [validate, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install release-note dependencies
        working-directory: website
        run: npm ci --ignore-scripts
      - name: Generate release notes
        working-directory: website
        run: node site/scripts/release-body-from-changelog.mjs --tag "${{ inputs.tag }}" --output "${RUNNER_TEMP}/release-notes.md"
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
        run: |
          set -euo pipefail
          prerelease=()
          if [ "${CHANNEL}" = beta ]; then
            prerelease=(--prerelease)
          fi
          gh release create "${TAG}" \
            --verify-tag \
            --draft \
            --title "${TAG}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            "${prerelease[@]}" \
            artifacts/*

  publish-marketplaces:
    name: Publish extension marketplaces
    if: ${{ !inputs.dry-run && needs.validate.outputs.channel == 'stable' }}
    needs: [validate, build, publish-github]
    uses: ./.github/workflows/publish-vsix.yml
    with:
      source-ref: ${{ inputs.tag }}
    secrets: inherit

  deploy-docs:
    name: Deploy production docs
    if: ${{ !inputs.dry-run && needs.validate.outputs.channel == 'stable' }}
    needs: [validate, publish-github]
    uses: ./.github/workflows/publish-docs.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit

  finalize:
    name: Publish GitHub Release
    if: ${{ !inputs.dry-run && always() && needs.publish-github.result == 'success' && (needs.publish-marketplaces.result == 'success' || needs.publish-marketplaces.result == 'skipped') && (needs.deploy-docs.result == 'success' || needs.deploy-docs.result == 'skipped') }}
    needs: [publish-github, publish-marketplaces, deploy-docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "${TAG}" --draft=false --latest
