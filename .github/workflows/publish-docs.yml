name: Publish production docs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag whose documentation is deployed to production
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      endpoint:
        required: true
      accessKeyId:
        required: true
      accessKeySecret:
        required: true
      bucketName:
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish production documentation
    runs-on: ubuntu-latest
    environment:
      name: docs
      url: https://vide.pascal-lab.net
    env:
      ASTRO_SITE: https://vide.pascal-lab.net
      ASTRO_BASE: /
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive
      - name: Prepare Vide LSP WASM
        uses: ./.github/actions/prepare-vide-lsp-wasm
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install website dependencies
        working-directory: website
        run: |
          npm ci
          node ../.github/scripts/install-native-optionals.mjs
      - name: Build production documentation
        working-directory: website
        run: npm run build
      - name: Setup ossutil
        uses: ./.github/actions/setup-ossutil
        with:
          endpoint: ${{ secrets.endpoint }}
          access-key-id: ${{ secrets.accessKeyId }}
          access-key-secret: ${{ secrets.accessKeySecret }}
      # ossutil 1.7 matches --include/--exclude against file names only: patterns that
      # contain a directory separator are rejected outright. A whole-root sync with
      # --delete would therefore remove the preview/ and staging/ prefixes owned by
      # the preview deployment, so sync every production top-level entry instead.
      # --delete then stays scoped to production paths; stale top-level entries are
      # the only thing a removed build output would leave behind.
      - name: Deploy production documentation
        env:
          BUCKET: ${{ secrets.bucketName }}
        run: |
          set -euo pipefail
          cd website/site/dist
          shopt -s nullglob dotglob
          for entry in *; do
            if [ -d "${entry}" ]; then
              ossutil sync "${entry}/" "oss://${BUCKET}/${entry}/" --delete -f --disable-ignore-error
            else
              ossutil cp -f "${entry}" "oss://${BUCKET}/${entry}" --disable-ignore-error
            fi
          done
