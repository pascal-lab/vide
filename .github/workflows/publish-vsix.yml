name: Publish VSIX

on:
  workflow_call:
    inputs:
      source-ref:
        required: true
        type: string
    secrets:
      VSCE_PAT:
        required: true
      OPEN_VSX_TOKEN:
        required: true

permissions:
  actions: read
  contents: read

jobs:
  publish:
    name: Publish VSIX packages
    runs-on: ubuntu-latest
    environment: vscode-marketplaces
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install extension dependencies
        run: npm ci
      - name: Download VSIX packages
        uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          path: artifacts
          merge-multiple: true
      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          for vsix in ../../artifacts/*.vsix; do
            node node_modules/@vscode/vsce/vsce publish --packagePath "${vsix}"
          done
      - name: Publish to Open VSX
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
        run: |
          set -euo pipefail
          for vsix in ../../artifacts/*.vsix; do
            npx --yes ovsx@1.1.1 publish "${vsix}" -p "${OPEN_VSX_TOKEN}"
          done
