# Workload catalog. RTL lives in optional git submodules under
# benches/workloads/<name> (update = none, so a normal clone does not fetch them).
# Manifests and probes are tracked here, not inside the upstream trees.

[[workload]]
name = "common_cells"
size = "small"
path = "benches/workloads/common_cells"
overlay = "benches/overlays/common_cells"
description = "PULP common_cells library"

[[workload]]
name = "ibex"
size = "medium"
path = "benches/workloads/ibex"
overlay = "benches/overlays/ibex"
description = "lowRISC Ibex RISC-V core"

[[workload]]
name = "cva6"
size = "large"
path = "benches/workloads/cva6"
overlay = "benches/overlays/cva6"
description = "OpenHW CVA6 application-class core"
