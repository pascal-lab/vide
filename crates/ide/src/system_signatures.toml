# IEEE 1800 system subroutine signatures for signature help.
#
# `kind` is "task" or "function"; `params` are semantic parameter labels with
# a trailing "..." marking variadic arguments. Every name and its kind must
# match slang's system subroutine tables (enforced by tests in
# signature_help.rs); the parameter labels themselves are semantic knowledge
# maintained here by hand.

